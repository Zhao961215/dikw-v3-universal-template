name: CI - DIKW v3.1 Deploy Test

"on":
  push:
    branches: [main, master, v3.1, v3.x]
    tags: ['v3.*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test deploy_dikw.py + verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # v3.1 仓库无 requirements.txt/pyproject.toml，禁用 pip cache
          cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Run 7 deploy tests
        run: |
          python3 04-一键部署/test_deploy.py

      - name: Run dry-run deploy
        run: |
          python3 04-一键部署/deploy_dikw.py --workspace . --dry-run || true

      - name: Security audit
        run: |
          echo "=== 审计 6 步：检查敏感词 ==="
          if grep -r "用户223475\|sk-I9l\|192.168.3.170\|fda9d40e" . --include="*.py" --include="*.sh" --include="*.md" --include="*.json" 2>/dev/null; then
            echo "❌ 命中敏感词！请检查"
            exit 1
          else
            echo "✅ 0 命中敏感词"
          fi

      - name: Python syntax check
        run: |
          python3 -m py_compile 04-一键部署/deploy_dikw.py
          python3 -m py_compile 04-一键部署/rollback_deploy.py
          python3 -m py_compile 04-一键部署/test_deploy.py

  audit:
    name: Audit 6-step (敏感词扫描)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sensitive keywords
        run: |
          echo "🔍 审计 6 步：扫描敏感信息"
          # 用占位符审计（避免 self-reference 反模式——README 里的真敏感词示例不再被误判）
          HIT=$(grep -r "{user_id}\|{api_key_prefix}\|{nas_ip}\|{commit_hash}" . --include="*.py" --include="*.sh" --include="*.md" 2>/dev/null | wc -l)
          if [ "$HIT" -gt 0 ]; then
            echo "❌ 命中 $HIT 处未替换的占位符"
            grep -r "{user_id}\|{api_key_prefix}\|{nas_ip}\|{commit_hash}" . --include="*.py" --include="*.sh" --include="*.md"
            exit 1
          fi
          echo "✅ 0 命中（占位符审计通过）"

      - name: Check for executable .py files
        run: |
          echo "🔍 检查 .py 文件不应有可执行属性"
          # 1. 验证 .py 文件不应该被当作 .sh 跑
          find . -name "*.py" -executable -not -name "test_*.py" | head -5
          echo "(以上 .py 文件如可执行，请检查)"

  size-check:
    name: Size check (v3.1 < 500 KB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repo size
        run: |
          SIZE=$(du -sk . | cut -f1)
          echo "Repository size: $SIZE KB"
          if [ "$SIZE" -gt 500 ]; then
            echo "⚠️  仓库大小超过 500 KB（$SIZE KB），请检查是否包含大文件"
          else
            echo "✅ 仓库大小 OK"
          fi
